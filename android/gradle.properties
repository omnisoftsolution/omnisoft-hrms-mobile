org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# Flutter 3.44 / Kotlin Gradle Plugin 2.x default this to `error`, which hard-fails
# the build when a plugin's Java and Kotlin compile tasks target different JVM
# versions (e.g. tflite_flutter pins Java 11 but leaves Kotlin's jvmTarget unset →
# resolves to 17 under JDK 17; other plugins pin Java 17). The plugin set is
# heterogeneous, so no single forced target unifies them — and the difference is
# benign on Android (all classes are dexed under the JDK 17 toolchain). Downgrade
# the check to a warning to restore the pre-3.44 behaviour.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
