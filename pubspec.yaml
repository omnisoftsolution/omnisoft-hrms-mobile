name: omni_hr
description: Omni HR — Mobile attendance and leave management
publish_to: 'none'
version: 1.21.0+77

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.0
  intl: ^0.20.0
  geolocator: ^14.0.2
  google_fonts: ^8.0.2
  table_calendar: ^3.1.3
  file_picker: ^10.0.0
  image_picker: ^1.1.0
  open_filex: ^4.5.0
  flutter_pdfview: ^1.4.0
  # Rasterizes PDF receipt pages to images for OCR + thumbnail preview.
  # Uses the OS PDF engine (Android PdfRenderer / iOS CoreGraphics), so
  # it does NOT bundle pdfium and won't collide with flutter_pdfview.
  # PDF upload never depends on this — rasterization is best-effort and
  # degrades to a file-chip if it fails.
  pdfx: ^2.6.0
  path_provider: ^2.1.5
  camera: ^0.11.0
  # camera_avfoundation 0.9.23+ uses iOS 18 SDK API surface that
  # does not compile under older Xcode. Xcode 26 has it, but
  # leaving this pin in place is harmless and keeps builds
  # reproducible across machines on different Xcode versions.
  camera_avfoundation: 0.9.18+9
  device_info_plus: ^11.5.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  google_mlkit_face_detection: ^0.13.0
  tflite_flutter: ^0.12.1
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates platform launcher icons from a single source PNG.
  # Source lives at macos/Runner/Assets.xcassets/AppIcon.appiconset/
  # because that's where the original 1024×1024 Omnisoft icon is
  # checked in. Run `dart run flutter_launcher_icons` after updating
  # the source to regenerate iOS + Android icons.
  flutter_launcher_icons: ^0.14.4

# ⚠️ The generator corrupts ios/Runner.xcodeproj/project.pbxproj
# (ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS) — snapshot
# and restore the pbxproj around a run when only Android sources changed.
flutter_launcher_icons:
  ios: true
  android: true
  # Android (legacy + adaptive foreground): safe-zone build of the iOS art
  # below — mark scaled into the adaptive-icon 66dp safe circle on white
  # (generated from app_icon_ios_1024.png; see git log for the recipe).
  image_path_android: "assets/images/app_icon_android_1024.png"
  # iOS uses the dedicated 2026-07 app icon (swirl + phone glyph,
  # full-bleed 1024, corners NOT pre-rounded — Apple applies the mask).
  image_path_ios: "assets/images/app_icon_ios_1024.png"
  # Apple rejects 1024×1024 App Store icons that contain an alpha
  # channel. Strip alpha and composite the swirl onto a white card so
  # the iOS launcher matches the in-app login-screen branding.
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  # Android adaptive icon (covers C2 from the Wave 1 review — modern
  # Android 8+ launchers expect this).
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon_android_1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
