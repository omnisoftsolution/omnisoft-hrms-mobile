name: omni_hr
description: Omni HR — Mobile attendance and leave management
publish_to: 'none'
version: 1.17.8+56

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  shared_preferences: ^2.5.0
  provider: ^6.1.0
  intl: ^0.20.0
  geolocator: ^14.0.2
  google_fonts: ^8.0.2
  table_calendar: ^3.1.3
  file_picker: ^10.0.0
  image_picker: ^1.1.0
  open_filex: ^4.5.0
  flutter_pdfview: ^1.4.0
  path_provider: ^2.1.5
  camera: ^0.11.0
  # camera_avfoundation 0.9.23+ uses iOS 18 SDK API surface that
  # does not compile under older Xcode. Xcode 26 has it, but
  # leaving this pin in place is harmless and keeps builds
  # reproducible across machines on different Xcode versions.
  camera_avfoundation: 0.9.18+9
  device_info_plus: ^11.5.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1
  google_mlkit_face_detection: ^0.13.0
  tflite_flutter: ^0.12.1
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates platform launcher icons from a single source PNG.
  # Source lives at macos/Runner/Assets.xcassets/AppIcon.appiconset/
  # because that's where the original 1024×1024 Omnisoft icon is
  # checked in. Run `dart run flutter_launcher_icons` after updating
  # the source to regenerate iOS + Android icons.
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  android: true
  # Source is the in-app Omnisoft brand mark (450×450). The generator
  # upscales it to 1024×1024 for the App Store icon — slightly soft
  # but recognizably Omnisoft, not Flutter's default placeholder.
  # When a higher-res export from design lands, swap this path.
  image_path: "assets/images/omnisoft_logo.png"
  # Apple rejects 1024×1024 App Store icons that contain an alpha
  # channel. Strip alpha and composite the swirl onto a white card so
  # the iOS launcher matches the in-app login-screen branding.
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  # Android adaptive icon (covers C2 from the Wave 1 review — modern
  # Android 8+ launchers expect this).
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/omnisoft_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
